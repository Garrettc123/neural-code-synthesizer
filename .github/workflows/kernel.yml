name: Plain-English Kernel CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile plain_english_kernel.py
      - name: Smoke test
        run: |
          python plain_english_kernel.py "build a FastAPI service called ci-api on port 8080" --output /tmp/ci-api --json
          test -f /tmp/ci-api/Dockerfile
          test -f /tmp/ci-api/app.py
          test -f /tmp/ci-api/manifest.json
      - name: Unit tests
        run: python -m unittest discover -s . -p 'test_*.py'
